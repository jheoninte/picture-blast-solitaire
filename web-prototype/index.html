<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Picture Blast Solitaire</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#111827,#020617);color:#f8fafc}.layout{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.sidebar{padding:16px;background:rgba(15,23,42,.92)}.board{display:flex;align-items:center;justify-content:center;padding:16px}.peek{width:100%;height:180px;object-fit:cover;border-radius:14px;margin:8px 0 14px;background:#1e293b}.tri{display:grid;grid-template-columns:repeat(5,72px);gap:10px}.card{width:72px;height:92px;border-radius:12px;border:1px solid rgba(255,255,255,.18);padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.24)}.red{background:#7f1d1d}.black{background:#172554}button,input{border:none;border-radius:10px;padding:10px 12px}button{background:#2563eb;color:white;cursor:pointer}.ghost{background:#334155}.hud{font-size:13px;color:#cbd5e1;line-height:1.5}</style></head><body><div class="layout"><aside class="sidebar"><h2 style="margin-top:0;">Picture Blast Solitaire</h2><input id="upload" type="file" accept="image/*" style="width:100%;margin-bottom:10px;" /><img id="preview" class="peek" alt="art preview" /><div class="hud" id="hud"></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;"><button id="dealBtn">New Deal</button><button id="bossBtn" class="ghost">Boss 3x3</button><button id="soundBtn" class="ghost">Sound/Haptic</button></div></aside><main class="board"><div><div id="tri" class="tri"></div></div></main></div><script>const tri=document.getElementById('tri'),hud=document.getElementById('hud'),preview=document.getElementById('preview'),upload=document.getElementById('upload');const st={center:7,removed:0,boss:false,soundOn:true,cards:[]};let a;function beep(f){if(!st.soundOn)return;a||=(new(window.AudioContext||window.webkitAudioContext));const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.025;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.18);o.stop(a.currentTime+.18);navigator.vibrate?.(12)}function rnd(i){const v=1+Math.floor(Math.random()*13),s=['♠','♥','♣','♦'][Math.floor(Math.random()*4)];return{id:i,value:v,suit:s,color:s==='♥'||s==='♦'?'red':'black',removed:false}}function deal(){st.center=7;st.removed=0;const n=st.boss?9:25;st.cards=Array.from({length:n},(_,i)=>rnd(i));render()}function ok(card){const d=Math.abs(card.value-st.center);return d===1||d===12}function render(){const cols=st.boss?3:5;tri.style.gridTemplateColumns=`repeat(${cols},72px)`;tri.innerHTML='';st.cards.forEach(card=>{const b=document.createElement('button');b.className=`card ${card.color}`;b.disabled=card.removed;b.style.opacity=card.removed?.12:1;b.innerHTML=`<span>${card.value}</span><span>${card.suit}</span>`;b.onclick=()=>{if(card.removed||!ok(card))return;card.removed=true;st.center=card.value;st.removed++;beep(280+card.value*20);render()};tri.appendChild(b)});const percent=Math.round(st.removed/st.cards.length*100);preview.style.opacity=.18+percent/120;hud.innerHTML=`Center Card: <b>${st.center}</b><br/>Reveal: <b>${percent}%</b><br/>Mode: <b>${st.boss?'Boss 3x3':'Main 5x5'}</b>`}upload.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>preview.src=ev.target.result;r.readAsDataURL(f)};document.getElementById('dealBtn').onclick=deal;document.getElementById('bossBtn').onclick=()=>{st.boss=!st.boss;deal()};document.getElementById('soundBtn').onclick=e=>{st.soundOn=!st.soundOn;e.target.textContent=st.soundOn?'Sound/Haptic':'Muted'};preview.src='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect width="400" height="220" fill="#0f172a"/><circle cx="120" cy="110" r="60" fill="url(#g)"/><rect x="190" y="50" width="130" height="120" rx="18" fill="#f59e0b" opacity="0.85"/></svg>`);deal();</script></body></html>
